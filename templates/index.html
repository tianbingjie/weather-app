<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081426"><link rel="manifest" href="/static/manifest.json"><link rel="stylesheet" href="/static/css/style.css"><title>WeatherCN Weather</title></head><body><main class="shell"><header><div class="brand"><span>☼</span><div><strong>WeatherCN</strong><small>LIVE WEATHER</small></div></div><div class="actions"><button id="locate">⌖</button><button id="theme">◐</button></div></header><section class="search"><input id="search" placeholder="搜索城市，例如：北京"><button id="searchBtn">搜索</button><div id="results"></div></section><div id="status" class="status">请输入城市或使用定位</div><section id="app" class="hidden"><div class="hero card"><div><p id="place">—</p><h1><span id="temp">—</span><sup>°</sup></h1><p id="condition">—</p><p class="muted">体感 <span id="feel">—</span> · 湿度 <span id="humidity">—</span></p></div><div class="hero-icon" id="icon">☀</div></div><div class="grid"><section class="card wide"><div class="title"><h2>未来 24 小时</h2><span>小时预报</span></div><div id="hourly" class="scroll-row"></div></section><section class="card wide"><div class="title"><h2>未来 7 天</h2><span>逐日预报</span></div><div id="daily"></div></section><section class="card"><div class="title"><h2>空气质量</h2><span>实时</span></div><div class="metrics" id="air"></div></section><section class="card"><div class="title"><h2>生活指数</h2><span>今日建议</span></div><div id="indices" class="index-grid"></div></section><section class="card"><div class="title"><h2>天气预警</h2><span>官方发布</span></div><div id="alerts">暂无生效预警</div></section><section class="card"><div class="title"><h2>分钟降水</h2><span>未来约 2 小时</span></div><div id="minute">暂无分钟级数据</div></section></div></section></main><script src="/static/js/app.js"></script></body></html>
